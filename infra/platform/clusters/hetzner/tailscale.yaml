# Hetzner only. The local cluster is Docker on a laptop that is already on the
# tailnet, so an operator there would publish services nobody needs to reach
# remotely and burn tailnet devices doing it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/platform/tailscale
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Nothing here needs storage or the cache. It does need nodes that are not
  # tainted uninitialized, which is what hcloud clears -- the same reason every
  # other Kustomization on this cluster waits for it.
  dependsOn:
    - name: hcloud
  # The operator's OAuth client is committed encrypted, like every other secret
  # in this repository.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
