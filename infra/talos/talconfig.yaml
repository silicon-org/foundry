# Machine configuration for the Hetzner cluster.
#
# talhelper generates per-node Talos configs from this plus the patches below.
# The local Docker cluster does not use this file at all -- `talosctl cluster
# create` generates its own configs and takes the same patches directly. What
# the two share is patches/base.yaml, which is the whole point: environments
# differ by an overlay, not by a fork.
#
#   bazel run //infra/talos:genconfig
#
# Every address here is fixed in //infra/tofu rather than assigned by Hetzner,
# which is what allows this file to be static instead of generated after apply.
# infra/tofu/outputs.tf prints the same values; if they ever disagree, tofu is
# the one telling the truth.
clusterName: foundry

talosVersion: v1.13.8
kubernetesVersion: v1.36.2

# The load balancer's private address, fixed in infra/tofu/apiserver.tf. Private
# because a Hetzner load balancer cannot have a firewall in front of it, so a
# public one would be the Kubernetes API exposed to the internet. It resolves
# from the tailnet and nowhere else.
endpoint: https://10.0.1.5:6443

# Control planes run etcd and the API server and nothing else. On a cluster this
# small it is tempting to let them take workloads too, and the reason not to is
# recent: a saturated node takes its control plane with it, and build workloads
# are exactly the kind that saturate one.
allowSchedulingOnControlPlanes: false

# The API server's certificate has to cover the addresses people actually reach
# it on, and the endpoint above is not one of them from outside the cluster.
#
# Without these, break-glass is only half a mechanism: opening the firewall to
# an administrator's address gets TCP through, and then kubectl fails TLS
# verification because the certificate names only the private endpoint and the
# node addresses. talosctl is unaffected -- it has its own CA -- which is
# exactly why the gap survives casual testing.
#
# These are Hetzner-assigned rather than chosen, so unlike everything else in
# this file they have to be copied from `tofu output control_plane_public_ipv4`.
# They are attached to primary IPs, so they survive rebuilding the servers; they
# do not survive destroying the primary IPs themselves.
additionalApiServerCertSans:
  - 178.105.1.30

cniConfig:
  name: none

patches:
  - "@patches/base.yaml"
  - "@patches/hetzner.yaml"

# Applied only to control planes, because Talos refuses a cluster.etcd block on
# a worker rather than ignoring it.
controlPlane:
  patches:
    - "@patches/hetzner-controlplane.yaml"
    - "@patches/tailscale-controlplane.yaml"

# The Tailscale config is split by role rather than shared, because the two
# roles get different tags and only the control planes advertise a route. The
# worker runs untrusted CI, and a subnet router carries the administrative
# traffic that crosses it.
worker:
  patches:
    - "@patches/hetzner-worker.yaml"
    - "@patches/tailscale-worker.yaml"

nodes:
  - hostname: foundry-cp-1
    ipAddress: 10.0.1.11
    controlPlane: true
    installDisk: /dev/sda

  # The always-on worker: a cpx42 carrying the services, the ARC runner and a
  # small Buildbarn worker. It replaced a ccx33 that cost EUR 149.71/month to be
  # idle 94% of the time and could not build the one action that needed it.
  #
  # Elastic workers are added beside this one and deleted when idle. They are
  # not listed here: talhelper renders one config per node, and an autoscaled
  # node cannot wait for someone to run apply-config -- see tasks/autoscaling.md
  # P3, which is the piece still unsolved.
  - hostname: foundry-worker-2
    ipAddress: 10.0.1.22
    controlPlane: false
    installDisk: /dev/sda
