name: CI

# One job for the code, and a weekly one that asks a question the first cannot.
#
# The code job runs on our own cluster and runs everything -- `bazel test //...`
# rather than a curated list of directories, because deciding what needs to
# re-run is Bazel's job and it is better at it than a path filter. Unchanged
# targets are cache hits and cost nothing; changing a pin re-runs exactly what
# depends on that pin, on the commit that changed it.
#
# A fork's pull request gets nothing here. That is deliberate: this repository
# is public, arbitrary code must never execute on our hardware, and offering a
# reduced GitHub-hosted pipeline instead meant maintaining a second job that
# duplicated the first and told us nothing we did not already know. Anyone can
# run `bazel test //...` locally; what they cannot have is our runners.
#
# See infra/platform/arc/README.md for the full threat model.

on:
  push:
    branches: [main]
  pull_request:
  # So the cluster path can be exercised without inventing a commit. Useful when
  # what changed is the cluster rather than the code.
  workflow_dispatch:
  schedule:
    # Weekly, for the upstream job below only.
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  # Our runner image deliberately ships almost nothing, so the version is named
  # here rather than left to whatever a runner happens to preinstall.
  BAZELISK_VERSION: "1.29.0"

jobs:
  cluster:
    # A fork's pull request never reaches this job. workflow_dispatch is
    # included because triggering it requires write access, the same bar as
    # pushing a branch here. Excluded on schedule: the weekly run exists to ask
    # the upstream question, not to rebuild unchanged code.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: foundry-hetzner-amd64

    # Build events go to the portal, which is the only way a CI build is
    # inspectable after the fact: this log says what failed, the portal says
    # which action, on which worker, and what it had already cached. Failing to
    # deliver them cannot fail the build -- see --bes_upload_mode in //.bazelrc.
    #
    # On every Bazel command in this job rather than just the long one, because
    # the portal groups invocations into a Build by the run they came from. One
    # instrumented command is a Build of one, which is a grouping that groups
    # nothing; three make the run inspectable as the single thing it is.
    #
    # The results URL is deliberately a localhost one. The portal is not exposed
    # outside the cluster, so the link is useless from a browser here and exact
    # for anyone running `bazel run //infra/platform/buildbarn:tunnel-hetzner`,
    # which is who reads it.
    env:
      BES: >-
        --bes_backend=grpc://bb-portal.bb-portal.svc.cluster.local:8082
        --bes_results_url=http://localhost:8081/bes/

    # Its own group, so this can never hold up the job below. Sharing one group
    # once meant a cluster job waiting on runners that no longer existed
    # cancelled five consecutive runs behind it, and CI produced no signal while
    # appearing broken rather than blocked.
    #
    # If the cluster is down this queues and eventually fails, which is the
    # intended behaviour: the cluster being unavailable is a fact worth seeing,
    # not a condition to skip past.
    concurrency:
      group: ${{ github.workflow }}-cluster-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      # Third-party actions are pinned to a commit SHA, not a tag. Tags are
      # mutable; a compromised action is a compromised build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip

      # No bazelisk-cache or repository-cache. Those store to GitHub's Actions
      # cache, which is a round trip out of the cluster and back for something
      # our own cache does one hop away.
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}

      # Seconds against the cache before spending minutes on a build. It answers
      # a different question from the step below -- whether this runner can
      # reach the cache at all -- and keeping them apart is what stops an
      # unreachable cluster reading as a broken commit.
      - name: Cache reachable
        run: |
          bazel build --config=ci $BES \
            --remote_cache=grpc://frontend-rw.buildbarn.svc.cluster.local:8980 \
            //infra/platform/buildbarn:cache_probe

      # Everything: manifests rendered, pinned tools resolved and run, Verilator
      # built from source, the design verilated and its test executed -- all on
      # cluster workers, and all decided by Bazel rather than by a list here.
      - name: Everything
        run: |
          bazel test --config=ci --config=hetzner $BES \
            --remote_executor=grpc://frontend-rw.buildbarn.svc.cluster.local:8980 \
            --experimental_remote_downloader=grpc://remote-asset.buildbarn.svc.cluster.local:8985 \
            //...

      # Which test failed, on the commit, instead of ten thousand lines of log.
      #
      # Collected here and published by the `report` job rather than here,
      # because the publisher is a Docker container action and these runners
      # have no Docker daemon -- deliberately: they are rootless pods under a
      # `restricted` Pod Security Standard, which is invariant #2. Worth knowing
      # how that fails, because it is not a step failure: GitHub pre-pulls
      # container actions during job *setup*, so an unrunnable one skips every
      # step in the job, including the build, and reports a job that never ran
      # as a failure of the thing it never reached.
      #
      # bazel-testlogs is a symlink into the output base, so -L is required, and
      # the tree is preserved because the path is the target label and that is
      # what makes the summary readable.
      - name: Collect test results
        if: always()
        run: |
          logs="$(bazel info bazel-testlogs)"
          find -L "$logs" -name test.xml -print0 | while IFS= read -r -d '' f; do
            rel="${f#"$logs"/}"
            mkdir -p "test-results/$(dirname "$rel")"
            cp "$f" "test-results/$rel"
          done
          echo "collected $(find test-results -name '*.xml' 2>/dev/null | wc -l) result files"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      # --redact: findings must never be echoed into a public build log.
      # Not a Bazel target because it reads git history rather than the tree.
      - name: Secret scan
        run: bazel run --config=ci $BES //tools:secret-scan -- git --redact --no-banner

  # The test summary, on a hosted runner because the publisher needs Docker and
  # our own runners deliberately have none. Nothing untrusted runs here: it
  # consumes XML this repository's own build produced, and a fork's pull request
  # never gets this far because `cluster` does not run for one.
  report:
    needs: cluster
    if: always() && needs.cluster.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-results
          path: test-results
        continue-on-error: true

      # action_fail is off: `cluster` already failed the build if anything
      # broke, and a second red check for the same event says nothing new.
      #
      # This reports *test* outcomes only. A target that fails to compile
      # produces no XML, so a red build beside a green summary means the failure
      # was a build failure -- read the log for those.
      - uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: hashFiles('test-results/**/*.xml') != ''
        with:
          files: test-results/**/*.xml
          check_name: Tests
          comment_mode: off
          action_fail: false

  # Can the pinned toolchain still be obtained from the internet?
  #
  # This is the one question the job above cannot ask, and it is not a
  # scheduling preference. Our asset service caches downloads by URI, so a build
  # routed through the cluster keeps succeeding long after upstream deletes a
  # release -- the cache answers, and nobody finds out until the cache is gone
  # too. So this runs on GitHub, with no cache of ours and none of GitHub's,
  # fetching every pin from its true source.
  #
  # Weekly, because upstream rot is slow, and a broken pin nobody has touched is
  # worth finding before someone needs a clean checkout in a hurry.
  upstream:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    concurrency:
      group: ${{ github.workflow }}-upstream
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No caches at all, deliberately. A cache hit here would answer the
      # question with our own copy of the bytes, which is precisely the answer
      # this job must not be allowed to give.
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}

      - name: Every pinned tool resolves and runs
        run: bazel run --config=ci //tools:versions
