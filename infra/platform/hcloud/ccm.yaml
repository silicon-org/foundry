apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hcloud-cloud-controller-manager
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: hcloud-cloud-controller-manager
      version: 1.35.0
      sourceRef:
        kind: HelmRepository
        name: hcloud
        namespace: flux-system
  # Values come from the ConfigMap generated out of values.yaml, so the release
  # Flux manages and the one //infra/platform/hcloud:bootstrap installs are
  # rendered from the same source.
  valuesFrom:
    - kind: ConfigMap
      name: hcloud-ccm-values
      valuesKey: values.yaml
  install:
    # The bootstrap install already created this release; adopting it rather
    # than colliding with it is what makes the handover to GitOps a non-event.
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
