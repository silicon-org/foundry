apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: foundry
  namespace: arc-runners
spec:
  interval: 1h
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.14.2
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
  dependsOn:
    - name: arc
      namespace: arc-systems
  values:
    # Scoped to one repository. The GitHub App backing it is installed on that
    # repository only.
    githubConfigUrl: https://github.com/silicon-org/foundry
    githubConfigSecret: github-app

    # What a workflow puts in `runs-on`.
    runnerScaleSetName: foundry-arm64

    # Idle runners cost memory and hold a registration. Scale from nothing.
    minRunners: 0
    maxRunners: 2

    # containerMode is deliberately unset. Its "dind" option runs a privileged
    # Docker daemon beside the runner, which hands any job root on the node and
    # would make every other control here decorative. Jobs needing containers
    # get a rootless builder instead.
    template:
      spec:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          fsGroup: 1001
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:2.334.0
            command: ["/home/runner/run.sh"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: [ALL]
            resources:
              requests: {cpu: 500m, memory: 1Gi}
              limits: {memory: 3Gi}
