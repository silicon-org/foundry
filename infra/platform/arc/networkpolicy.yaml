# Default-deny egress for everything running in arc-runners.
#
# This is the half of the cache-poisoning defence that config alone cannot
# provide. The read-only Buildbarn frontend already refuses Action Cache writes,
# but a refusal is a decision made by a service that could be misconfigured. The
# rule below means the read-write frontend is not reachable from this namespace
# at all: there is no route, so there is nothing to misconfigure.
#
# It is also what contains a compromised job. Runners execute untrusted code by
# design; without this, a malicious workflow can reach the Kubernetes API, the
# Talos API, every other namespace, and the whole internet.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: runners
  namespace: arc-runners
spec:
  # Every pod in the namespace, present and future. A policy that selects
  # specific runners is a policy that misses the next scale set someone adds.
  endpointSelector: {}

  # Stated explicitly rather than inferred from the presence of rules below.
  # Cilium only enforces a direction that a policy mentions, so an egress-only
  # policy silently leaves ingress wide open.
  enableDefaultDeny:
    ingress: true
    egress: true

  # Nothing connects *to* a runner. It reaches out to GitHub and is told what to
  # do; there is no inbound path in the design, so there is none here.
  ingress: []

  egress:
    # DNS, and only to the cluster's own resolver. The L7 rules matter for more
    # than filtering: Cilium's DNS proxy is what makes toFQDNs below work at
    # all, since it learns which addresses a name resolved to.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"

    # Both cache frontends, including the read-write one. This is accepted
    # risk, not an oversight, and it is worth stating the reasoning because the
    # conclusion depends on facts that will change.
    #
    # Fork pull requests never run here -- the workflow sends them to
    # GitHub-hosted runners -- so every job on these runners comes from someone
    # who pushed a branch to this repository, which requires write access.
    # Anyone with write access can already merge to main and edit workflows, so
    # being able to write the Action Cache adds essentially nothing to what they
    # can already do. In exchange, pull request builds populate the cache, which
    # for hour-long builds is the difference between usable and not.
    #
    # The residual risk is a compromised build dependency rather than a
    # compromised person: code running in a pull request job could poison an
    # entry that a later trusted build consumes.
    #
    # Revisit the moment any of these becomes true:
    #   - outside collaborators are given write access
    #   - fork pull requests are allowed on self-hosted runners
    #   - builds pull in dependencies we do not control end to end
    #
    # The two frontends already exist and the split is already proven, so
    # tightening this is an edit to these few lines plus a second namespace --
    # not a redesign. See infra/platform/buildbarn/README.md.
    - toEndpoints:
        - matchExpressions:
            - key: io.kubernetes.pod.namespace
              operator: In
              values: [buildbarn]
            - key: app
              operator: In
              values: [frontend-ro, frontend-rw]
      toPorts:
        - ports:
            - port: "8980"
              protocol: TCP

    # GitHub, for the runner protocol itself and for fetching actions.
    # broker.actions.githubusercontent.com is the long-poll endpoint that makes
    # inbound ports unnecessary.
    #
    # Note the double asterisk. In Cilium a single `*` matches DNS characters
    # *within one label* and never crosses a dot; `**.` is the specifier that
    # matches one or more whole labels. So `*.githubusercontent.com` would match
    # broker.actions... only by accident and would miss
    # pipelinesghubeus15.actions.githubusercontent.com, which is the shard the
    # Actions service actually assigns a runner -- and whose name changes.
    # Getting this wrong does not fail loudly: the runner retries the connection
    # until the job times out, and the job simply sits queued.
    # These cover every entry in GitHub's own published list, which is worth
    # re-deriving rather than trusting this comment:
    #
    #   gh api meta --jq '.domains.actions[]'
    #
    # The blob storage entry is not optional and is not about caching. A runner
    # uploads step logs and job results to productionresultssa0-19, so without
    # it a job runs to completion and then hangs in post, unable to report what
    # happened. Dropping the Actions cache does not remove this dependency.
    - toFQDNs:
        - matchName: github.com
        - matchName: ghcr.io
        - matchPattern: "**.github.com"
        - matchPattern: "**.githubusercontent.com"
        - matchPattern: "**.githubapp.com"
        # A single '*' is correct here: it matches characters within one label,
        # which is exactly the shard number.
        - matchPattern: "productionresultssa*.blob.core.windows.net"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

    # Build dependencies: the Bazel Central Registry and Bazel releases, which
    # bazelisk needs in order to produce a Bazel at all.
    #
    # This list grows as real builds need more, and each addition should be
    # argued for. An allow-list that accumulates entries without scrutiny
    # becomes an allow-all with extra steps.
    - toFQDNs:
        - matchName: bcr.bazel.build
        - matchName: releases.bazel.build
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
