apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: loki
      version: 7.3.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: loki-values
      valuesKey: values-loki.yaml
  # Not for a runtime dependency -- Loki does not talk to Prometheus. It is
  # that the chart guards its own ServiceMonitor on the CRD already existing
  # (`$.Capabilities.APIVersions.Has`), which helm-controller evaluates against
  # the live cluster at render time. On a first install without this ordering,
  # Loki renders before kube-prometheus-stack has installed the CRDs, the
  # ServiceMonitor is silently omitted, and it stays omitted until something
  # triggers another upgrade. Nothing reports an error at any point.
  dependsOn:
    - name: kube-prometheus-stack
  install:
    createNamespace: false
    timeout: 10m
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
