apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Storage comes from the base unchanged: this cluster has a StorageClass, so the
# PersistentVolumeClaim is honoured and the cache survives a restart -- and,
# because the class reclaims rather than deletes, survives the cluster too. That
# is the point of running one at all.
resources:
  - ../../../buildbarn
  - storage-volume.yaml
patches:
  # The cache sized to the volume this cluster has, rather than to the laptop the
  # base config describes. 56 of the 62.8 GiB the filesystem reports, leaving room
  # for the Action Cache beside it and slack on top -- Buildbarn's block files are
  # sparse, so a total larger than the volume would start cleanly and then fail
  # with ENOSPC once the files had grown into space that never existed.
  #
  # The blob ceiling follows from the size: 56 GiB over 21 blocks is 2.7 GiB,
  # which is the other half of why this matters. At 8 GiB it was 390 MiB, and
  # before that 215.6 MiB, which a single JDK exceeded.
  #
  # A strategic merge rather than a JSON patch by index, because env entries merge
  # by name: adding a variable to the base does not silently repoint this one at a
  # different array element.
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: storage
        namespace: buildbarn
      spec:
        template:
          spec:
            containers:
              - name: storage
                env:
                  - name: CAS_SIZE_GIB
                    value: "56"
                  - name: AC_SIZE_MIB
                    value: "2048"

  # The nodes here are x86, and a worker that advertised the wrong architecture
  # would be given actions it cannot run. See //platforms for the other end of
  # this agreement.
  - target:
      kind: Deployment
      name: worker
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: amd64

  # ccx33 is 8 dedicated cores, so one action at a time would waste most of the
  # machine. The bound is memory rather than cores, though, which is why this is
  # four and not eight.
  #
  # It was six, and six OOM-killed the runner repeatedly: a C++ action here
  # averages ~3.3 GiB, so six of them peak past 20 GiB while the rest of the
  # node -- monitoring, the ARC runner, storage -- needs about 10 GiB of the
  # 30.6 GiB the machine has. Measured, not estimated: the runner climbed from
  # 2.3 GiB to 17.4 GiB in four minutes and was killed on the way up.
  #
  # Raising the limit instead is not available. Anything past ~20 GiB
  # oversubscribes the node, and a node-level OOM picks its victim by score
  # rather than by whose fault it is -- kubelet and containerd included. Losing
  # one action to a cgroup limit is the containable failure; this keeps it that.
  #
  # Four is the number to revisit if the node grows. A ccx43 is double the
  # memory and would carry eight.
  - target:
      kind: Deployment
      name: worker
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: "4"

  # Limits sized to what is actually left on the node, rather than to the node's
  # total. Everything else resident -- Prometheus, Grafana, Loki, the storage
  # daemon, cilium -- is ~3.2 GiB, the ARC runner may add 3 GiB during CI, and
  # the worker container beside this one may take 4 GiB. Against 30.6 GiB of
  # capacity and a proper system reserve, that leaves the runner about 16 GiB.
  #
  # 20 GiB was the old value and it was arithmetic done as though the runner
  # were the only thing on the machine: the sum of limits reached 123% of
  # allocatable, so honouring every limit at once was impossible by
  # construction.
  - target:
      kind: Deployment
      name: worker
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 4Gi
      - op: replace
        path: /spec/template/spec/containers/1/resources/requests/cpu
        value: "4"
      - op: replace
        path: /spec/template/spec/containers/1/resources/limits/memory
        value: 16Gi
