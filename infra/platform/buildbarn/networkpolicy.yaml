# Egress policy for the asset service, and the reason it exists is worth stating
# plainly: without it, this component silently undoes the runner allow-list.
#
# bb-remote-asset fetches whatever URI a client asks for. Its configuration has
# no allow-list -- HttpFetcherConfiguration carries HTTP client options and
# nothing else -- so a runner that is forbidden from reaching the internet can
# simply ask this service to reach it instead, and get the bytes back through
# the CAS. Every rule in ../arc/networkpolicy.yaml would still be in force and
# would no longer be worth anything.
#
# So the allow-list moves to where the fetching actually happens. This is the
# better place for it: one service, one list, rather than the same list repeated
# in every namespace that might want to download something.
#
# Only this deployment is selected. The other Buildbarn components talk to each
# other and to nothing else, and giving storage or the scheduler an internet
# route would be inventing an exposure that does not currently exist.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: remote-asset
  namespace: buildbarn
spec:
  endpointSelector:
    matchLabels:
      app: remote-asset

  # Stated rather than inferred. Cilium only enforces a direction a policy
  # mentions, so an egress-only policy leaves ingress wide open.
  enableDefaultDeny:
    ingress: false
    egress: true

  egress:
    # DNS, and only the cluster's resolver. The L7 rules are also what make
    # toFQDNs work at all: Cilium's DNS proxy learns which addresses a name
    # resolved to.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
          rules:
            dns:
              - matchPattern: "*"

    # Storage, for the blobs it fetches and the mappings it records.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: buildbarn
            app: storage
      toPorts:
        - ports:
            - {port: "8981", protocol: TCP}

    # Where build dependencies may be fetched from.
    #
    # This list was assembled one failed build at a time before it was derived
    # properly, which is the wrong order and cost five round trips. Derive it:
    # delete this policy on a scratch cluster, fetch everything through the
    # asset service, and read back what it was asked for.
    #
    #   kubectl -n buildbarn delete cnp remote-asset      # temporarily
    #   bazel --output_base=/tmp/h build --nobuild \
    #     --experimental_remote_downloader=grpc://localhost:8985 \
    #     --remote_cache=grpc://localhost:8981 //...
    #   kubectl -n buildbarn logs deploy/remote-asset \
    #     | grep -oE "Fetching Blob \[https://[^]/]+" | sort -u
    #
    # Run it twice, once natively and once with --config=hetzner. Repository
    # rules fetch per platform, so a macOS run never asks for the Linux busybox
    # and the host it comes from stays invisible until CI fails on it.
    #
    # Two entries below will not appear in that output at all, because the
    # service follows redirects internally and logs only what it was asked for:
    # codeload.github.com and the GitLab release bucket. Both are covered here
    # and both were found the hard way.
    - toFQDNs:
        - matchName: bcr.bazel.build
        - matchName: releases.bazel.build
        - matchName: gitlab.arm.com
        - matchName: mirror.bazel.build
        - matchName: mirrors.kernel.org
        - matchName: gitlabcommunity-eu1-eu-west-1-prod-packages.s3.eu-west-1.amazonaws.com
        # `**.github.com` rather than the bare name, because a tag archive
        # redirects to codeload.github.com. Allowing only github.com gets the
        # redirect and then times out on the body -- which reads as a network
        # fault rather than a policy one, and is the same trap as the
        # gitlab.arm.com release that redirects to S3.
        - matchName: github.com
        - matchPattern: "**.github.com"
        - matchPattern: "**.githubusercontent.com"

        # Where the pinned CLI toolchain comes from. Derived from the lockfile
        # rather than discovered one failure at a time:
        #
        #   python3 -c "import json;d=json.load(open('tools/multitool.lock.json'));\
        #     print({b['url'].split('/')[2] for k,v in d.items() if k!='\$schema' \
        #     for b in v['binaries']})"
        #
        # These arrived when CI moved to `bazel test //...`, which pulls
        # //tools:versions and with it every pinned CLI. Before that the tools
        # were only fetched by a workflow that deliberately does not use this
        # service.
        - matchName: dl.k8s.io
        - matchName: get.helm.sh

        # busybox, fetched by rules_coreutils for //tools:bazel_env. Linux only,
        # which is why it went unnoticed until CI ran on an x86 cluster.
        - matchName: snapshot-cloudflare.debian.org

        # Chisel and the jars XiangShan's generator is compiled against. Derived
        # from the lock file, which records the repository each artifact was
        # resolved from:
        #
        #   python3 -c "import json;print(list(json.load(open( \
        #     'hardware/ip/xiangshan/maven_install.json'))['repositories']))"
        #
        # One host today, and the lock file is where a second would appear.
        #
        # This one hid behind a warm cache: a developer's machine has the jars in
        # its repository cache from before remote execution was configured, so
        # nothing asks the asset service for them. CI starts empty and asks for
        # every one, which is the case that matters and the case nobody runs.
        - matchName: repo1.maven.org
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
