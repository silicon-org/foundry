apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../cilium
# A second ConfigMap rather than an edit to the first. The HelmRelease lists
# both in valuesFrom, and helm-controller merges them in order, so the shared
# file stays the single description of what every cluster runs and this one
# holds only the difference.
configMapGenerator:
  - name: cilium-values-hetzner
    namespace: kube-system
    files:
      - values-hetzner.yaml
generatorOptions:
  # Same reason as the base: HelmRelease.spec.valuesFrom is not rewritten by
  # kustomize's name reference tracking, so a hashed name would dangle.
  disableNameSuffixHash: true
patches:
  - target:
      kind: HelmRelease
      name: cilium
    patch: |
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: cilium-values-hetzner
          valuesKey: values-hetzner.yaml
