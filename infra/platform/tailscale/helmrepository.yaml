# In flux-system, like every other HelmRepository here, which is also why
# kustomization.yaml sets no top-level namespace -- see the note there.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: tailscale
  namespace: flux-system
spec:
  interval: 1h
  url: https://pkgs.tailscale.com/helmcharts
