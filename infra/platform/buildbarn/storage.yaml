# Holds the blobs. Only the frontends talk to it; it has no opinion about who
# is allowed to do what, because that decision belongs at the edge where the
# caller's trust level is known.
# Sized for a cloud cluster, because this claim only exists on one: the local
# overlay deletes it and mounts an emptyDir, since that cluster is destroyed on
# purpose and a cache persisted onto a node about to be deleted buys nothing.
#
# 64 GiB is chosen against a measurement rather than a feeling. One cold build of
# //hardware/... evicted its own inputs at 16 GiB -- the hermetic LLVM toolchain,
# Verilator, a JDK, the jars and a 139 MB generated top do not fit -- and what
# that costs is not a slow build but "Lost inputs no longer available remotely"
# partway through one.
#
# Growing this is the first half of a change; //infra/platform/buildbarn/config
# holds the second. Buildbarn's block files are sparse, so a cache configured
# larger than its volume does not fail at startup -- it fails weeks later with
# ENOSPC, once the file has grown into space that was never there.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage
  namespace: buildbarn
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 64Gi
---
apiVersion: v1
kind: Service
metadata:
  name: storage
  namespace: buildbarn
spec:
  selector:
    app: storage
  ports:
    - name: grpc
      port: 8981
      targetPort: 8981
    - name: metrics
      port: 9980
      targetPort: 9980
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage
  namespace: buildbarn
spec:
  replicas: 1
  # The volume is ReadWriteOnce, so the old pod has to be gone before the new
  # one starts. Rolling would deadlock on the volume attachment.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: storage
  template:
    metadata:
      labels:
        app: storage
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      # bb-storage creates its own block-device files but not the directory it
      # keeps persistent state in, and a fresh volume has neither. Without this
      # the pod crash-loops on first start -- on a new PVC as much as on an
      # emptyDir.
      initContainers:
        - name: mkdirs
          image: busybox@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          command:
            - sh
            - -c
            - mkdir -p /work/cas/persistent_state /work/ac/persistent_state
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: storage, mountPath: /work}
      containers:
        - name: storage
          image: ghcr.io/buildbarn/bb-storage@sha256:ebd7d282c79879687792f615e8a0b2e3a6e2d13e6cb2686c8b99a14cf37f08a9
          args: [/config/storage.jsonnet]
          ports:
            - containerPort: 8981
            - containerPort: 9980
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: storage, mountPath: /storage-cas, subPath: cas}
            - {name: storage, mountPath: /storage-ac, subPath: ac}
      volumes:
        - name: config
          configMap:
            name: buildbarn-config
        - name: storage
          persistentVolumeClaim:
            claimName: storage
