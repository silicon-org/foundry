apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 88.5.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  # Values come from a ConfigMap generated out of values-kube-prometheus-stack.yaml,
  # following the cilium/ pattern: the values a human reads and the values the
  # cluster runs are the same bytes.
  valuesFrom:
    - kind: ConfigMap
      name: kube-prometheus-stack-values
      valuesKey: values-kube-prometheus-stack.yaml
  install:
    createNamespace: false
    # These CRDs are the reason nobody should install this chart by hand. The
    # Prometheus CRD alone is large enough that `kubectl apply -f` fails on the
    # 262144-byte last-applied-configuration annotation; helm-controller does
    # not take that path, so through Flux it simply works. If you ever find
    # yourself applying them manually, use `kubectl create` or `--server-side`.
    crds: CreateReplace
    # Pulling five images onto a cold node takes longer than the 5m default,
    # and a timeout here is reported as a failed release rather than as
    # slowness. The Flux Kustomization that owns this gets a matching one.
    timeout: 15m
  upgrade:
    crds: CreateReplace
    timeout: 15m
    remediation:
      retries: 3
