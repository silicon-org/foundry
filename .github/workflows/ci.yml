name: CI

# This repository is public, so pull requests can come from forks -- that is,
# from people we have no reason to trust. Two rules follow, and neither is
# negotiable:
#
#   1. This workflow runs on GitHub-hosted runners only. Once the self-hosted
#      cluster exists it takes over the `push` job on trusted branches; fork PRs
#      stay here, on hardware GitHub owns and isolates.
#   2. Nothing here gets a secret. There is nothing worth stealing in this
#      workflow, which is the property that makes it safe to run on a fork's
#      code.
#
# See infra/platform/arc/README.md for the full threat model.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # GitHub-hosted images ship bazelisk; our runner image deliberately ships
  # almost nothing. Naming the version here means both jobs bootstrap Bazel the
  # same way, instead of one of them depending on what GitHub happens to
  # preinstall this month.
  BAZELISK_VERSION: "1.29.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a commit SHA, not a tag. Tags are
      # mutable; a compromised action is a compromised build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          repository-cache: true

      # Builds the wrappers and renders every kustomize root, which is the
      # check that actually catches things: a malformed kustomization otherwise
      # reaches the cluster and surfaces as a Flux reconcile failure, minutes
      # later, attached to a controller rather than to the commit.
      #
      # Deliberately not //..., which would drag in //tools:versions and
      # //tools:bazel_env and fetch all twelve pinned CLIs. Whether those still
      # download is a question about upstream, not about this commit, so it is
      # asked on a schedule instead -- see toolchain.yml.
      #
      # --config=ci makes a stale MODULE.bazel.lock an error rather than
      # something the build quietly rewrites.
      - name: Build and render manifests
        run: bazel test --config=ci //infra/...

      # --redact: findings must never be echoed into a public build log.
      - name: Secret scan
        run: bazel run --config=ci //tools:secret-scan -- git --redact --no-banner

  # Runs on our own hardware, against our own cache.
  self-hosted:
    # The gate that makes self-hosted CI on a public repository survivable.
    # A fork's pull request never reaches this job, so it never reaches our
    # cluster. Fork contributors are served by the GitHub-hosted job above.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: foundry-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No bazelisk-cache or repository-cache here. Those store to GitHub's
      # Actions cache, which lives behind Azure blob storage -- a whole extra
      # egress destination to allow-list, for a cache that is in the wrong place
      # for a self-hosted runner anyway. Bazel's own remote cache is in-cluster
      # and one hop away.
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}

      # Trusted builds write the cache; everything else may only read it.
      # The read-only frontend refuses Action Cache writes outright, so this
      # choice of hostname is a courtesy to the client rather than the control.
      # Deliberately not //..., which pulls in //tools:bazel_env and eagerly
      # fetches all twelve pinned CLIs -- roughly 500MB, re-downloaded by every
      # ephemeral runner. The GitHub-hosted job above already builds the whole
      # tree and checks the toolchain, so doing it twice buys nothing.
      #
      # This builds the cache probe instead, which is what this job is actually
      # for: proving remote caching works on our own hardware. It gets replaced
      # by a real workload once there is one.
      - name: Build against the remote cache
        env:
          FRONTEND: ${{ github.event_name == 'push' && 'frontend-rw' || 'frontend-ro' }}
        run: |
          bazel build --config=ci \
            --remote_cache=grpc://${FRONTEND}.buildbarn.svc.cluster.local:8980 \
            //infra/platform/buildbarn:cache_probe
