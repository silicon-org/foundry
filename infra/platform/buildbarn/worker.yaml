# Worker and runner are one pod on purpose. The worker materialises an action's
# inputs onto a shared volume and hands the command to the runner over a unix
# socket on that same volume, so they must share a filesystem and a lifecycle.
#
# The runner container's image is the action environment. Whatever an action can
# execute is what is inside that image, which makes this the place where the EDA
# toolchain decision gets made: freely redistributable tools can arrive as Bazel
# action inputs, but anything multi-gigabyte or licence-restricted belongs here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: buildbarn
spec:
  replicas: 1
  strategy:
    # Never two workers at once, and on this cluster that is not a preference.
    #
    # The Hetzner overlay gives this pod 5 of the node's 8 CPUs. A RollingUpdate
    # -- the default, and what this was until the first change to this file
    # actually tried to roll it -- starts the replacement before the old pod
    # exits, because maxUnavailable of 25% on one replica rounds down to zero.
    # Two of these do not fit on the node, so the new pod sits Pending forever,
    # the Deployment reports Failed, and Flux marks the whole buildbarn
    # Kustomization unhealthy. Builds keep working throughout, on the old pod,
    # which is what makes it easy to miss.
    #
    # Recreate is also the honest description of what this workload is: a
    # singleton sharing an emptyDir and a unix socket with its runner sidecar.
    # There is nothing for a second copy to do except fail to schedule.
    type: Recreate
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      initContainers:
        # Copies the bb_runner binary into a volume the runner container can
        # see, so the action environment image does not have to know anything
        # about Buildbarn.
        - name: runner-installer
          image: ghcr.io/buildbarn/bb-runner-installer@sha256:e102ade0952f9a6f98fc91e6b88da4c08e2354f561f8aed8de7d8d3ae18b283f
          volumeMounts:
            - {name: bb, mountPath: /bb}
        - name: volume-init
          image: busybox@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          command: [sh, -c, "mkdir -pm 0777 /worker/build && mkdir -pm 0777 /worker/cache && chmod 0777 /worker"]
          volumeMounts:
            - {name: worker, mountPath: /worker}
      containers:
        - name: worker
          image: ghcr.io/buildbarn/bb-worker@sha256:49ccaa7e3e298ebdf4b31f43d207bb72b7b36636cfd8b4c8e73adc10e1693505
          args: [/config/worker.jsonnet]
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            # What this worker tells the scheduler it can execute. It has to be
            # the architecture of the node underneath it and it has to match the
            # exec_properties of the platform in //platforms that clients ask
            # for -- three things that must agree, in three different files.
            #
            # arm64 here because the local cluster is Apple Silicon; the Hetzner
            # overlay patches it to amd64. Getting it wrong does not fail at
            # deploy time: the worker registers happily and then actions fail on
            # it in ways that look like anything but a platform mismatch.
            - name: ISA
              value: arm64
            # One at a time here, because this cluster is a Docker VM shared
            # with a Kubernetes control plane, a CI runner and everything else.
            # Cloud overlays raise it to suit the node they actually have.
            - name: RUNNER_CONCURRENCY
              value: "1"
            # Which size class this worker serves. Unset is a jsonnet evaluation
            # error, so a worker refuses to start rather than registering for a class
            # it cannot actually run -- the same guard as ISA.
            - name: SIZE
              value: small
            # Only read when SIZE is large. Defined here anyway so the variable is
            # never merely absent -- jsonnet is lazy, so an unset one would fail on
            # the day a worker first served the large class and not before.
            - name: LARGE_CONCURRENCY
              value: "1"
          ports:
            # The only port the worker exposes. It dials the scheduler rather
            # than being dialled, so this exists purely so a PodMonitor can
            # select it by name -- see infra/platform/monitoring/scrape/.
            - {name: metrics, containerPort: 9980}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: worker, mountPath: /worker}
        - name: runner
          # Supplies glibc and its headers. Clang itself is shipped to the
          # worker as an action input, so this image provides the platform an
          # action links against and nothing more -- it is not where the
          # toolchain lives.
          image: gcc@sha256:5e927c284bf55a7dc796262e311a0703344f62f41f5621eb56843111b1d37e15
          command: [/bb/bb_runner, /config/runner.jsonnet]
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {memory: 2Gi}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: worker, mountPath: /worker}
            - {name: bb, mountPath: /bb, readOnly: true}
      volumes:
        - name: bb
          emptyDir: {}
        - name: worker
          emptyDir: {}
        - name: config
          configMap:
            name: buildbarn-config
