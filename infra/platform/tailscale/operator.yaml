apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 1h
  chart:
    spec:
      chart: tailscale-operator
      version: 1.102.3
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: tailscale-operator-values
      valuesKey: values-operator.yaml
  install:
    createNamespace: false
    timeout: 10m
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
