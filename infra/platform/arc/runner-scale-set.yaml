apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: foundry
  namespace: arc-runners
spec:
  interval: 1h
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.14.2
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
  dependsOn:
    - name: arc
      namespace: arc-systems
  values:
    # Scoped to one repository. The GitHub App backing it is installed on that
    # repository only.
    githubConfigUrl: https://github.com/silicon-org/foundry
    githubConfigSecret: github-app

    # What a workflow puts in `runs-on`, and it must be unique per cluster.
    #
    # GitHub identifies a scale set by this name against the repository, not by
    # which cluster it came from. Two clusters registering the same name are one
    # scale set with two listeners as far as GitHub is concerned, and a job goes
    # to whichever claims it first -- so a workflow silently runs on either
    # machine, which is precisely what `runs-on` is supposed to decide.
    #
    # This placeholder is deliberately unusable. Every cluster overlay replaces
    # it, and a cluster that forgets gets a visibly wrong scale set rather than
    # quietly stealing another cluster's jobs.
    runnerScaleSetName: foundry-CLUSTER-UNSET

    # Idle runners cost memory and hold a registration. Scale from nothing.
    minRunners: 0
    maxRunners: 2

    # containerMode is deliberately unset. Its "dind" option runs a privileged
    # Docker daemon beside the runner, which hands any job root on the node and
    # would make every other control here decorative. Jobs needing containers
    # get a rootless builder instead.
    template:
      spec:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          fsGroup: 1001
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: runner
            # This pin has a shelf life, unlike every other version in this
            # repository. GitHub deprecates old runner versions server-side and
            # then refuses them at the broker, so an unmaintained pin does not
            # keep working -- it breaks, and it breaks badly: the runner exits
            # immediately, the scale set wedges, and jobs queue forever instead
            # of failing. Bump this when GitHub releases a new runner.
            # See actions/actions-runner-controller#4601.
            image: ghcr.io/actions/actions-runner:2.336.0
            command: ["/home/runner/run.sh"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: [ALL]
            resources:
              requests: {cpu: 500m, memory: 1Gi}
              limits: {memory: 3Gi}
