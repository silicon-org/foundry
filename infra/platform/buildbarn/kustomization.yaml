apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: buildbarn
resources:
  - namespace.yaml
  - storage.yaml
  - frontend-rw.yaml
  - frontend-ro.yaml
  - scheduler.yaml
  - worker.yaml
  - remote-asset.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: buildbarn-config
    files:
      - config/common.libsonnet
      - config/frontend.libsonnet
      - config/frontend-ro.jsonnet
      - config/frontend-rw.jsonnet
      - config/storage.jsonnet
      - config/scheduler.jsonnet
      - config/worker.jsonnet
      - config/remote-asset.jsonnet
      - config/runner.jsonnet
# The generated ConfigMap keeps its content hash in the name, so editing any
# jsonnet file produces a new name, which rewrites the Deployments that mount
# it, which rolls the pods. Without this a config change lands in the cluster
# and changes nothing until something happens to restart the pod -- and the
# symptom is a service quietly running configuration nobody can see in git.
#
# Cilium's ConfigMap deliberately does the opposite, because HelmRelease
# valuesFrom is not rewritten by kustomize and a hashed name would dangle.
