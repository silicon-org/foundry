apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hcloud-cloud-controller-manager
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: hcloud-cloud-controller-manager
      version: 1.35.0
      sourceRef:
        kind: HelmRepository
        name: hcloud
        namespace: flux-system
  values:
    # The secret is committed encrypted; see token.sops.yaml.
    env:
      HCLOUD_TOKEN:
        valueFrom:
          secretKeyRef:
            name: hcloud
            key: token

    networking:
      # Tells the CCM which private network the nodes are on, so it can populate
      # node addresses from it rather than from the public interface. Matches
      # hcloud_network.cluster in //infra/tofu.
      enabled: true
      clusterCIDR: 10.244.0.0/16
      network:
        valueFrom:
          secretKeyRef:
            name: hcloud
            key: network

    # The CCM has to run before the cluster is usable -- until it removes the
    # uninitialized taint, nothing else schedules -- so it must tolerate the
    # very taint it exists to clear, and run on control planes.
    tolerations:
      - key: node.cloudprovider.kubernetes.io/uninitialized
        value: "true"
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        effect: NoSchedule
      - key: node.kubernetes.io/not-ready
        effect: NoSchedule
