apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrepository.yaml
  - token.sops.yaml
  - ccm.yaml
  - csi.yaml
configMapGenerator:
  - name: hcloud-ccm-values
    namespace: kube-system
    files:
      - values.yaml
generatorOptions:
  # HelmRelease.spec.valuesFrom is not rewritten by kustomize's name reference
  # tracking, so a hashed name would dangle. Same reason as Cilium.
  disableNameSuffixHash: true
