apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: buildbarn
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/platform/clusters/local/buildbarn
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cilium
