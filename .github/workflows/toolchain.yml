name: Toolchain

# Verifies that every pinned CLI still downloads and runs at its pinned version.
#
# This is a question about the outside world, not about any particular commit:
# it fails when an upstream release is deleted or moved, or when a checksum
# stops matching. Running it on every push would fetch roughly 500MB to
# re-answer a question whose answer almost never changes, so it runs when the
# pins themselves change, once a week, and on demand.
#
# Separate from CI for two reasons that are not stylistic. Its triggers cannot
# be expressed as a job inside that workflow -- path filters are workflow-level,
# so folding it in would mean losing "run when a pin changes" and finding a bad
# pin a week later.
#
# And it deliberately does not use the cluster. Our asset service caches
# downloads by URI, so a build routed through it would keep succeeding long
# after upstream deleted the release -- the cache would be answering, and the
# one question this workflow exists to ask would silently stop being asked.

on:
  push:
    branches: [main]
    paths:
      - tools/multitool.lock.json
      - tools/tools.bzl
      - MODULE.bazel
      - .bazelversion
  pull_request:
    paths:
      - tools/multitool.lock.json
      - tools/tools.bzl
      - MODULE.bazel
      - .bazelversion
  schedule:
    # Weekly. Upstream rot is slow, and a broken pin that nobody has touched is
    # worth finding before someone needs a clean checkout in a hurry.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  BAZELISK_VERSION: "1.29.0"

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          repository-cache: true

      - name: Every pinned tool resolves and runs
        run: bazel run --config=ci //tools:versions

      - name: Everything builds
        run: bazel build --config=ci //...
