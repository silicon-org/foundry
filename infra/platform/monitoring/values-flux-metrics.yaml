              suspended:
              - spec
              - suspend
        - groupVersionKind:
            group: notification.toolkit.fluxcd.io
            version: v1beta3
            kind: Provider
          metricNamePrefix: gotk
          metrics:
          - name: resource_info
            help: The current state of a Flux Provider resource.
            each:
              type: Info
              info:
                labelsFromPath:
