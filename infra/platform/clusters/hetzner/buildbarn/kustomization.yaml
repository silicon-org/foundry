apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Storage comes from the base unchanged: this cluster has a StorageClass, so the
# PersistentVolumeClaim is honoured and the cache survives a restart -- and,
# because the class reclaims rather than deletes, survives the cluster too. That
# is the point of running one at all.
resources:
  - ../../../buildbarn
  - storage-volume.yaml
  # The large size class. Only this cluster has one: the local cluster is a
  # laptop, and an action needing 24 GiB has nowhere to go there either way.
  - worker-large.yaml
patches:
  # The cache sized to the volume this cluster has, rather than to the laptop the
  # base config describes. 56 of the 62.8 GiB the filesystem reports, leaving room
  # for the Action Cache beside it and slack on top -- Buildbarn's block files are
  # sparse, so a total larger than the volume would start cleanly and then fail
  # with ENOSPC once the files had grown into space that never existed.
  #
  # The blob ceiling follows from the size: 56 GiB over 21 blocks is 2.7 GiB,
  # which is the other half of why this matters. At 8 GiB it was 390 MiB, and
  # before that 215.6 MiB, which a single JDK exceeded.
  #
  # A strategic merge rather than a JSON patch by index, because env entries merge
  # by name: adding a variable to the base does not silently repoint this one at a
  # different array element.
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: storage
        namespace: buildbarn
      spec:
        template:
          spec:
            containers:
              - name: storage
                env:
                  - name: CAS_SIZE_GIB
                    value: "56"
                  - name: AC_SIZE_MIB
                    value: "2048"

  # The nodes here are x86, and a worker that advertised the wrong architecture
  # would be given actions it cannot run. See //platforms for the other end of
  # this agreement.
  - target:
      kind: Deployment
      name: worker
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: amd64

  # ccx33 is 8 dedicated cores, so one action at a time would waste most of the
  # machine. The bound is memory rather than cores, though, which is why this is
  # four and not eight.
  #
  # Two, and the reason is one action rather than the average.
  #
  # Six OOM-killed the runner constantly. Four still did: Verilating
  # //hardware/soc/xs_cluster/tb needs more than 16 GiB on its own, which is
  # visible in the shape -- a smooth ramp to the ceiling, reproduced identically
  # on each of Bazel's three retries, not the sawtooth that concurrent actions
  # make. Sizing from a ~3.3 GiB average was the wrong model for a workload with
  # one action this far into the tail.
  #
  # So concurrency is set low enough that the heavy action is close to alone
  # with the limit below, rather than sharing it. That costs parallelism on the
  # thousands of small actions, which is the trade until the node is bigger: a
  # ccx43 is double the memory and would carry this comfortably at six.
  - target:
      kind: Deployment
      name: worker
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: "2"

  # Sized for the 16 GB always-on node, not for a build machine. This worker
  # exists to serve the common run -- a cache walk that executes about three
  # actions -- and deliberately cannot run the heavy ones: those declare
  # size=large and wait for an elastic node. See tasks/autoscaling.md.
  #
  # The node also carries ~3.2 GiB of services and the ARC runner's 3 GiB, so
  # this is what is left rather than what a build would like.
  #
  # Previously sized for a 30 GB dedicated node. Everything else resident
  # -- Prometheus, Grafana, Loki, the storage daemon, cilium -- is ~3.2 GiB, the
  # ARC runner may add 3 GiB during CI, and the node now keeps 1 GiB for itself.
  # Against 30.6 GiB of capacity that leaves about 23 GiB.
  #
  # The worker container's 4 GiB was the easiest 2 GiB to find: it peaks at
  # 0.17 GiB, so 2 GiB is still an order of magnitude of headroom and the rest
  # goes to the runner, which is the container that actually needs it.
  #
  # Whether 20 GiB is enough is not yet known -- every measurement so far was
  # truncated by the limit that killed it, so the true peak of the Verilator
  # action has never been observed. If this OOMs again the answer is a larger
  # node rather than another guess: there is no more headroom here to find.
  - target:
      kind: Deployment
      name: worker
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
      - op: replace
        path: /spec/template/spec/containers/1/resources/requests/cpu
        value: "2"
      - op: replace
        path: /spec/template/spec/containers/1/resources/limits/memory
        value: 6Gi
