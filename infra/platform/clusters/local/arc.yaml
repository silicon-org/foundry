apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: arc
  namespace: flux-system
spec:
  interval: 10m
  path: ./infra/platform/clusters/local/arc
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cilium
  # The GitHub App credentials are committed encrypted. This is what lets Flux
  # read them; the key itself is the one secret created outside git, because it
  # is the key that would be needed to decrypt itself.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
