apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: alloy
      version: 1.11.1
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: alloy-values
      valuesKey: values-alloy.yaml
  # Loki first, because Alloy starts shipping immediately and a write to an
  # endpoint that does not resolve is a backlog with a retry loop in front of
  # it.
  #
  # kube-prometheus-stack for the CRDs, and this chart fails differently from
  # Loki's: it renders its ServiceMonitor unconditionally rather than guarding
  # on the CRD existing, so without the ordering the install does not quietly
  # omit the object -- it fails outright with "no matches for kind
  # ServiceMonitor". That is the better of the two failures, and the ordering
  # is what makes it not happen at all.
  dependsOn:
    - name: kube-prometheus-stack
    - name: loki
  install:
    createNamespace: false
    timeout: 10m
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
