apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrepository.yaml
  - helmrelease.yaml
configMapGenerator:
  - name: cilium-values
    namespace: kube-system
    files:
      - values.yaml
generatorOptions:
  # The HelmRelease refers to this ConfigMap by name, and kustomize's name
  # reference rewriting does not understand HelmRelease.spec.valuesFrom. A
  # hashed name would silently dangle, so the name stays stable; helm-controller
  # watches the ConfigMap and upgrades on change regardless.
  disableNameSuffixHash: true
